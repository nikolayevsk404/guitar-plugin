name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # Buildado como passo explicito ANTES do CMake (nao como custom command do CMake) --
      # ver comentario em CMakeLists.txt sobre por que isso e mais confiavel no Windows.
      # O retry cobre falhas de rede transitorias no registry do npm (ja aconteceu em CI).
      - name: Build UI (React/TS)
        shell: bash
        working-directory: ui
        run: |
          for attempt in 1 2 3; do
            npm install && npm run build && exit 0
            echo "npm install/build falhou (tentativa $attempt/3), tentando de novo..."
            sleep 5
          done
          exit 1

      # So no Windows: JUCE_USE_WIN_WEBVIEW2=1 (CMakeLists.txt) exige o header WebView2.h em
      # tempo de compilacao, mesmo usando carregamento dinamico em runtime. Baixa o .nupkg
      # oficial direto (confirmado localmente: build/native/include/WebView2.h e
      # build/native/x64/WebView2LoaderStatic.lib) em vez de depender de `nuget`/PowerShell
      # Install-Package instalados no runner.
      - name: Fetch WebView2 SDK (Windows only)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p webview2_packages/Microsoft.Web.WebView2.1.0.4078.44
          curl -fsSL -o webview2.nupkg "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/1.0.4078.44"
          unzip -q webview2.nupkg -d webview2_packages/Microsoft.Web.WebView2.1.0.4078.44

      # -A x64 e obrigatorio no Windows: sem isso, o gerador Visual Studio do CMake default
      # pra Win32 (x86) -- o build compila limpo, mas gera um .vst3 de 32 bits que o Windows
      # se recusa a carregar num host de 64 bits (STATUS_INVALID_IMAGE_FORMAT,
      # "nao foi projetado para ser executado no Windows ou contem um erro"). Confirmado num
      # Reaper x64 real. Makefiles/Ninja (macOS) nao entendem -A, entao so aplica no Windows.
      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -B build -A x64 -DCMAKE_BUILD_TYPE=Release -DJUCE_WEBVIEW2_PACKAGE_LOCATION="${{ github.workspace }}/webview2_packages"
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DJUCE_WEBVIEW2_PACKAGE_LOCATION="${{ github.workspace }}/webview2_packages"
          fi

      - name: Build plugin
        run: cmake --build build --config Release --parallel

      - name: Run DSP unit tests (Catch2)
        working-directory: build
        run: ctest -C Release --output-on-failure

      # pluginval valida o VST3 gerado (crash/threading/state) -- NFR-003 em spec.md.
      - name: Download pluginval
        shell: bash
        run: |
          mkdir -p tools/pluginval
          if [ "$RUNNER_OS" = "Windows" ]; then
            curl -fsSL -o tools/pluginval/pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
          else
            curl -fsSL -o tools/pluginval/pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          fi
          unzip -o tools/pluginval/pluginval.zip -d tools/pluginval

      - name: Run pluginval (strict)
        shell: bash
        run: |
          VST3_PATH=$(find build -iname "*.vst3" -print -quit)
          if [ -z "$VST3_PATH" ]; then
            echo "Nenhum .vst3 encontrado em build/ -- ajustar este passo (T050 em tasks.md)."
            exit 1
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            PLUGINVAL_BIN=$(find tools/pluginval -type f -iname "pluginval.exe" -print -quit)
          else
            PLUGINVAL_BIN=$(find tools/pluginval -type f -iname "pluginval" -print -quit)
            chmod +x "$PLUGINVAL_BIN"
          fi
          "$PLUGINVAL_BIN" --strictness-level 10 --validate "$VST3_PATH"

      # Artefato baixavel a partir da pagina do run do Actions (aba "Summary", secao
      # "Artifacts") -- e a forma de pegar o .vst3 do Windows sem ter uma maquina Windows.
      - name: Upload VST3 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NikolayevskDarkDSP-${{ matrix.os }}
          path: build/**/*.vst3
          if-no-files-found: warn
